name: E2E Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      E2E_BASE_URL: http://localhost:8080
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard required secrets
        run: |
          if [ -z "${E2E_EMAIL}" ] || [ -z "${E2E_PASSWORD}" ]; then
            echo "::error::Defina E2E_EMAIL e E2E_PASSWORD como secrets do repositório."
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Python (para gerar o PDF de fixture)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install reportlab
        run: pip install --no-cache-dir reportlab

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Gerar fixture PDF
        run: bun run test:e2e:fixtures

      - name: Build
        run: bun run build

      - name: Start preview server
        run: |
          (bun run dev > /tmp/dev.log 2>&1 &) 
          echo "Aguardando http://localhost:8080 ..."
          for i in $(seq 1 60); do
            if curl -sSf http://localhost:8080 > /dev/null 2>&1; then
              echo "Server up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Dev server não iniciou em 60s"
          tail -n 200 /tmp/dev.log || true
          exit 1

      - name: Run Playwright tests
        run: bun run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14

      - name: Upload dev server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dev-server-log
          path: /tmp/dev.log
          retention-days: 7
